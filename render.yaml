# Render Blueprint for the Podchives background worker.
#
# How to use:
#   1. Push this repo to GitHub.
#   2. Render → New → Blueprint → connect this repo. Render reads this file.
#   3. Set the env vars listed below in the Render dashboard. They are NOT
#      committed to the repo.
#
# This worker is single-purpose: drain processing_jobs continuously.
# It connects to the same Supabase Postgres your Vercel app uses.

services:
  - type: worker
    name: podchives-worker
    runtime: docker # ffmpeg + yt-dlp are installed in the Dockerfile
    dockerfilePath: ./Dockerfile
    plan: starter # $7/mo. Use `free` to test first; free workers sleep.
    region: oregon
    branch: main
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_DEMO_MODE
        value: "false"
      - key: PROCESSING_MODE
        value: "render-worker"
      - key: OVERNIGHT_PROCESSING_ENABLED
        value: "false"
      - key: MAX_JOBS_PER_RUN
        value: "15"
      # Run up to N jobs in parallel. Most jobs wait on network I/O (yt-dlp,
      # OpenAI), so this drains the backlog much faster. Lower to 2–3 if YouTube
      # rate-limits or cookies expire quickly during backfill.
      - key: WORKER_CONCURRENCY
        value: "3"
      - key: MAX_EPISODES_QUEUED_PER_SYNC
        value: "50"
      - key: MAX_EPISODES_QUEUED_PER_SYNC_RSS
        value: "100"
      - key: MAX_QUEUED_EPISODES_PER_SOURCE
        value: "50"
      - key: MAX_QUEUED_EPISODES_PER_SOURCE_RSS
        value: "75"
      - key: MAX_INFLIGHT_EPISODES_PER_SOURCE
        value: "15"
      - key: MAX_INFLIGHT_EPISODES_PER_SOURCE_RSS
        value: "20"
      # Auto-sync is controlled per-source in the app (Sources page → the
      # "auto-sync" toggle on each source). Every source ships OFF, so no
      # backfill starts until you flip one on. AUTO_SYNC_ENABLED is just a
      # global master kill-switch; leave "true" for normal operation.
      - key: AUTO_SYNC_ENABLED
        value: "true"
      - key: AUTO_SYNC_INTERVAL_MINUTES
        value: "360"
      # Render mounts secret files at /etc/secrets/<filename> at runtime.
      - key: YOUTUBE_COOKIES_FILE
        value: /etc/secrets/cookies.txt
      # ---- secrets — set in the Render dashboard, not here ----
      - key: DATABASE_URL
        sync: false # set in Render UI, do not commit
      - key: OPENAI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: TRANSCRIPTION_BACKEND
        value: youtube_captions_then_groq
