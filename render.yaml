# Render Blueprint for the Podchives background worker.
#
# How to use:
#   1. Push this repo to GitHub.
#   2. Render → New → Blueprint → connect this repo. Render reads this file.
#   3. Set the env vars listed below in the Render dashboard. They are NOT
#      committed to the repo.
#
# This worker is single-purpose: drain processing_jobs continuously.
# It connects to the same Supabase Postgres your Vercel app uses.

services:
  - type: worker
    name: podchives-worker
    runtime: docker # ffmpeg + yt-dlp are installed in the Dockerfile
    dockerfilePath: ./Dockerfile
    plan: starter # $7/mo. Use `free` to test first; free workers sleep.
    region: oregon
    branch: main
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_DEMO_MODE
        value: "false"
      - key: PROCESSING_MODE
        value: "render-worker"
      - key: OVERNIGHT_PROCESSING_ENABLED
        value: "false"
      - key: MAX_JOBS_PER_RUN
        value: "10"
      # Auto-sync: worker re-syncs each source on this cadence to ingest new
      # uploads and drain any backlog. Shipped OFF so the ~$50-65 first-run
      # backfill doesn't start on deploy — flip to "true" in the Render
      # dashboard when you're ready for the full sync to begin.
      - key: AUTO_SYNC_ENABLED
        value: "false"
      - key: AUTO_SYNC_INTERVAL_MINUTES
        value: "360"
      # Render mounts secret files at /etc/secrets/<filename> at runtime.
      - key: YOUTUBE_COOKIES_FILE
        value: /etc/secrets/cookies.txt
      # ---- secrets — set in the Render dashboard, not here ----
      - key: DATABASE_URL
        sync: false # set in Render UI, do not commit
      - key: OPENAI_API_KEY
        sync: false
