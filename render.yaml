# Render Blueprint for the Podchives background worker.
#
# How to use:
#   1. Push this repo to GitHub.
#   2. Render → New → Blueprint → connect this repo. Render reads this file.
#   3. Set the env vars listed below in the Render dashboard. They are NOT
#      committed to the repo.
#
# This worker is single-purpose: drain processing_jobs continuously.
# It connects to the same Supabase Postgres your Vercel app uses.

services:
  - type: worker
    name: podchives-worker
    runtime: node
    plan: starter # $7/mo. Use `free` to test first; free workers sleep.
    region: oregon
    branch: main
    buildCommand: |
      apt-get update && apt-get install -y ffmpeg curl
      curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
      chmod +x /usr/local/bin/yt-dlp
      npm install --include=dev && npx prisma generate && npx tsc --noEmit
    startCommand: npm run worker
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_DEMO_MODE
        value: "false"
      - key: PROCESSING_MODE
        value: "render-worker"
      - key: OVERNIGHT_PROCESSING_ENABLED
        value: "false"
      - key: MAX_JOBS_PER_RUN
        value: "10"
      # ---- secrets — set in the Render dashboard, not here ----
      - key: DATABASE_URL
        sync: false # set in Render UI, do not commit
      - key: OPENAI_API_KEY
        sync: false
      - key: YOUTUBE_COOKIES_FILE
        sync: false # optional; only set if you upload a cookies.txt at /opt/render/project/src/cookies.txt
